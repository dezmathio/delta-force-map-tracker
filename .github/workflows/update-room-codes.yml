name: Update room codes

on:
  schedule:
    # Codes rotate daily; hit a few UTC slots in case reset timing shifts.
    - cron: "10 0 * * *"
    - cron: "10 8 * * *"
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch room codes
        env:
          DF_ROOM_APPKEY: ${{ secrets.DF_ROOM_APPKEY }}
          DF_ROOM_APP_ID: ${{ secrets.DF_ROOM_APP_ID }}
          DF_ROOM_API_BASE: ${{ secrets.DF_ROOM_API_BASE }}
        run: python scripts/fetch_room_codes.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add room-codes.json
          if git diff --staged --quiet; then
            echo "No room-code changes"
          else
            git commit -m "chore: update daily room codes"
            git push
          fi
